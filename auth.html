<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Task Manager - Account</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #080a0f;

            color: white;

            padding: 20px;
        }

        .card {
            width: 430px;
            max-width: 100%;

            padding: 35px;

            border-radius: 20px;

            background: #11151c;

            border: 1px solid #2a313d;

            box-shadow:
                0 30px 80px rgba(0,0,0,.45);
        }

        .logo {
            width: 52px;
            height: 52px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background:
                linear-gradient(
                    145deg,
                    #45a8ff,
                    #1978ff
                );

            font-size: 27px;

            font-weight: 900;
        }

        h1 {
            text-align: center;

            font-size: 28px;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #7e8998;

            font-size: 14px;

            margin-bottom: 27px;
        }

        .group {
            margin-bottom: 16px;
        }

        label {
            display: block;

            color: #9ba5b3;

            font-size: 13px;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 13px;

            border-radius: 9px;

            outline: none;

            border: 1px solid #2b333e;

            background: #0c0f14;

            color: white;

            transition: .25s;
        }

        input:focus {
            border-color: #328fff;

            box-shadow:
                0 0 0 3px
                rgba(50,143,255,.10);
        }

        button {
            width: 100%;

            border: none;

            cursor: pointer;

            padding: 13px;

            margin-top: 5px;

            border-radius: 9px;

            background: #278dff;

            color: white;

            font-weight: bold;

            transition: .25s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .switch {
            text-align: center;

            margin-top: 18px;

            color: #737d8c;

            font-size: 13px;
        }

        .switch span {
            color: #55aaff;

            cursor: pointer;
        }

        .message {
            min-height: 20px;

            margin-top: 15px;

            text-align: center;

            color: #65b5ff;

            font-size: 13px;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #707a89;

            font-size: 13px;
        }

        .back:hover {
            color: white;
        }
        @keyframes authCardIn {
    from {
        opacity: 0;
        transform: translateY(30px) scale(.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.card {
    animation: authCardIn .6s ease both;
}

.logo {
    transition: transform .3s ease;
}

.logo:hover {
    transform: scale(1.06) rotate(-3deg);
}

button {
    transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(39,141,255,.18);
}

    </style>

</head>


<body>


    <div class="card">

        <div class="logo">
            T
        </div>


        <h1 id="title">
            Welcome back.
        </h1>


        <p class="subtitle" id="subtitle">
            Sign in to your Task Manager account.
        </p>


        <form id="authForm">


            <div class="group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit" id="submitButton">
                Sign In
            </button>

        </form>


        <div class="message" id="message"></div>


        <div class="switch">

            <span id="switchText">
                Don't have an account?
            </span>

            <span id="switchButton">
                Create one
            </span>

        </div>


        <a href="index.html" class="back">
            ← Back to Home
        </a>

    </div>


    <script>

        let signupMode = false;


        const params =
            new URLSearchParams(
                window.location.search
            );


        const selectedPlan =
            params.get("plan");


        const form =
            document.getElementById(
                "authForm"
            );


        const title =
            document.getElementById(
                "title"
            );


        const subtitle =
            document.getElementById(
                "subtitle"
            );


        const submitButton =
            document.getElementById(
                "submitButton"
            );


        const switchText =
            document.getElementById(
                "switchText"
            );


        const switchButton =
            document.getElementById(
                "switchButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        function showMessage(text) {

            message.textContent = text;

        }


        switchButton.addEventListener(
            "click",
            () => {

                signupMode = !signupMode;

                showMessage("");


                if (signupMode) {

                    title.textContent =
                        "Create your account.";

                    subtitle.textContent =
                        "Start your productivity journey.";

                    submitButton.textContent =
                        "Create Account";

                    switchText.textContent =
                        "Already have an account?";

                    switchButton.textContent =
                        "Sign in";

                } else {

                    title.textContent =
                        "Welcome back.";

                    subtitle.textContent =
                        "Sign in to your Task Manager account.";

                    submitButton.textContent =
                        "Sign In";

                    switchText.textContent =
                        "Don't have an account?";

                    switchButton.textContent =
                        "Create one";

                }

            }
        );


        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                showMessage("Please wait...");


                const endpoint =
                    signupMode
                        ? "/api/signup"
                        : "/api/login";


                try {
const response = await fetch(endpoint, {
    method: "POST",

    credentials: "same-origin",

    headers: {
        "Content-Type": "application/json"
    },

    body: JSON.stringify({
        email,
        password
    })
});;


                    const data =
                        await response.json();


                    if (!response.ok) {

                        showMessage(
                            data.message ||
                            "Something went wrong."
                        );

                        return;
                    }


                    showMessage(
                        data.message
                    );

setTimeout(
    () => {

        if (selectedPlan) {

            window.location.href =
                "premium.html?plan=" +
                encodeURIComponent(
                    selectedPlan
                );

        } else {

            window.location.href =
                "account.html";

        }

    },
    500
);


                } catch (error) {

                    showMessage(
                        "Could not connect to server."
                    );

                    console.error(error);

                }

            }
        );

    </script>

</body>

</html>
